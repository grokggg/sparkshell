name: build-apk

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          ls -la
          tar xzf sparkshell-src.tar.gz
          ls sparkshell

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter --version && flutter doctor -v | head -40

      - name: Configure project
        working-directory: sparkshell
        run: |
          set -e
          sed -i 's/ndkVersion = "27.2.12479018"/ndkVersion = "28.2.13676358"/' android/app/build.gradle
          sed -i 's/applicationId = "com.xinghuo.sparkshell"/applicationId = "com.grokggg.sparkshell"/' android/app/build.gradle
          python3 -c "import pathlib; p=pathlib.Path('android/app/build.gradle'); t=p.read_text(); t=t if 'packaging {' in t else t.replace('    externalNativeBuild {', '    packaging {\n        jniLibs {\n            excludes += [\"lib/armeabi-v7a/**\", \"lib/x86_64/**\"]\n        }\n    }\n\n    externalNativeBuild {'); p.write_text(t); print('packaging ok')"
          grep -n 'applicationId\|namespace\|packaging' android/app/build.gradle
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          sed -i '/org.gradle.parallel/d;/org.gradle.daemon/d;/org.gradle.workers.max/d;/kotlin.compiler.execution.strategy/d;/kotlin.incremental/d' android/gradle.properties
          cat android/gradle.properties
          flutter pub get

      - name: Build release APK
        working-directory: sparkshell
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tail -40

      - name: Sign check (non-blocking)
        working-directory: sparkshell
        continue-on-error: true
        run: |
          set +e
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh $APK
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | head -1)
          echo "apksigner=$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK" | tee apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sparkshell-apk
          path: sparkshell/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-apk
          name: SparkShell 1.1.0 (arm64, com.grokggg.sparkshell)
          files: sparkshell/build/app/outputs/flutter-apk/app-release.apk
          body: |
            Flutter 3.50.0 + NDK 28.2 构建，仅 arm64-v8a，包名 com.grokggg.sparkshell，自签（sparkshell.jks）。
            三个 Tab：本地 PTY（libptybridge.so）/ SSH（dartssh2）/ WebRTC（flutter_webrtc）。
