name: build-apk

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          ls -la
          tar xzf sparkshell-src.tar.gz
          ls sparkshell

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter --version && flutter doctor -v | head -40

      - name: Configure project
        working-directory: sparkshell
        run: |
          sed -i 's/ndkVersion = "27.2.12479018"/ndkVersion = "28.2.13676358"/' android/app/build.gradle
          grep -n ndkVersion android/app/build.gradle
          flutter pub get

      - name: Build release APK
        working-directory: sparkshell
        run: flutter build apk --release --target-platform android-arm64 --verbose 2>&1 | tail -120

      - name: Sign check
        working-directory: sparkshell
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh $APK
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs $APK
          sha256sum $APK

      - uses: actions/upload-artifact@v4
        with:
          name: sparkshell-apk
          path: sparkshell/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: SparkShell 1.0.0 (arm64)
          files: sparkshell/build/app/outputs/flutter-apk/app-release.apk
          body: |
            Flutter 3.50.0 + NDK 28.2 构建，arm64-v8a，自签（sparkshell.jks）。
            三个 Tab：本地 PTY（libptybridge.so）/ SSH（dartssh2）/ WebRTC（flutter_webrtc）。
