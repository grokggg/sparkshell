name: build-apk

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source tree
        run: |
          ls sparkshell | head
          grep -n '^version' sparkshell/pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Configure project
        working-directory: sparkshell
        run: |
          set -e
          sed -i 's/ndkVersion = "27.2.12479018"/ndkVersion = "28.2.13676358"/' android/app/build.gradle
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          sed -i '/org.gradle.parallel/d;/org.gradle.daemon/d;/org.gradle.workers.max/d;/kotlin.compiler.execution.strategy/d;/kotlin.incremental/d' android/gradle.properties
          grep -n 'applicationId\|targetSdk\|abortOnError' android/app/build.gradle || true
          flutter pub get

      # ---------- 1) 小包：Alpine 3.6 MB，只为 30 秒验证 proot 链路 ----------
      - name: Rootfs (alpine, 3.6 MB)
        run: |
          set -e
          F=$(curl -s https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/ \
              | grep -oE 'alpine-minirootfs-[0-9.]+-aarch64\.tar\.gz' | sort -u | tail -1)
          echo "alpine=$F"
          curl -sL -o /tmp/alpine.tgz "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/$F"
          sudo rm -rf /tmp/alp && sudo mkdir -p /tmp/alp
          sudo tar -xzf /tmp/alpine.tgz -C /tmp/alp
          echo 'nameserver 223.5.5.5' | sudo tee /tmp/alp/etc/resolv.conf >/dev/null
          rm -f sparkshell/assets/rootfs.tar
          sudo tar -cf sparkshell/assets/rootfs.tar --numeric-owner -C /tmp/alp .
          sudo chown -R $(id -u):$(id -g) sparkshell/assets
          ls -lh sparkshell/assets/rootfs.tar

      - name: Build APK (alpine)
        working-directory: sparkshell
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 --dart-define=FLAVOR=alpine 2>&1 | tail -25
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-alpine.apk
          ls -lh /tmp/app-alpine.apk

      # ---------- 2) 全量包：Debian bookworm，apt/python3/git 全在 ----------
      - name: Rootfs (debian bookworm, arm64)
        run: |
          set -e
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq debootstrap
          sudo rm -rf /tmp/db
          sudo debootstrap --arch=arm64 --foreign --variant=minbase \
            --include=apt,bash,coreutils,curl,ca-certificates,git,python3,less,nano,procps,psmisc,file \
            bookworm /tmp/db http://deb.debian.org/debian 2>&1 | tail -5
          # /dev /proc /sys 由 proot 从宿主 bind 进来，打进包里只会让解包报 mknod 错
          rm -f sparkshell/assets/rootfs.tar
          sudo tar -cf sparkshell/assets/rootfs.tar --numeric-owner \
            --exclude=./dev --exclude=./proc --exclude=./sys -C /tmp/db .
          sudo chown -R $(id -u):$(id -g) sparkshell/assets
          ls -lh sparkshell/assets/rootfs.tar

      - name: Build APK (debian)
        working-directory: sparkshell
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 --dart-define=FLAVOR=debian 2>&1 | tail -25
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-debian.apk
          ls -lh /tmp/app-debian.apk

      - name: Sign + hash
        continue-on-error: true
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | head -1)
          for f in /tmp/app-alpine.apk /tmp/app-debian.apk; do
            echo "== $f"; "$APKSIGNER" verify --print-certs "$f" | head -3; sha256sum "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sparkshell-apk
          path: |
            /tmp/app-alpine.apk
            /tmp/app-debian.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.0-apk
          name: SparkShell 1.9.0 (diff 着色 + 步数放宽到 12)
          files: |
            /tmp/app-alpine.apk
            /tmp/app-debian.apk
          body: |
            **1.9.0**
            - 工具结果里的 diff 按行着色：`+` 绿、`-` 红、`@@` 蓝，改了哪几行一眼看到
            - `write_file` / `edit_file` 自动产出 diff，不用再手动 cat 对比
            - Agent 单轮步数 6 → 12：像"装 python3 + 跑脚本"这种链路不会再半路停
            - 暂停提示改成"发「继续」我接着跑"，已完成的步骤不会重来

            **1.8.0**
            - 文件页长按 → 「发给 Agent」：路径直接落到 Chat 输入框（`@/root/hello.py`），自动切到 Chat 页
            - 编辑保存时自动补结尾换行，`cat` 输出不再和提示符黏成一行

            **1.7.1**
            - 「新建文件」对话框的提示文字被当成了初始值，结果建出 `文件名（如 hello.py）` 这种鬼名字；现在只做提示、不预填
            - 文件名/文件夹名校验：空名、含斜杠、`.` / `..`、超长一律拦下
            - 重命名同样走校验；建完提示完整路径

            **1.7.0**
            - 终端快捷键条：⏎ 回车 / Tab / Ctrl-C / Ctrl-D / 清屏 —— 中文输入法吃掉回车也能执行命令
            - 文件页新增「新建文件」，直接进编辑器（之前只有新建文件夹，`hello.py` 会变成目录）
            - Alpine/Debian 包源自动切阿里云镜像，`apk add` 不再 180s 超时
            - Chat 报错说人话：429 免费额度、401 Key 失效、网络不通分开提示

            **1.6.6 —— 构建流程修正**
            - 源码直接放在 `sparkshell/` 目录并由构建直接读取，不再依赖 `sparkshell-src.tar.gz`
            - 改哪个文件、发哪一版，一一对应

            **1.6.5 —— 重要：之前 1.6.1~1.6.4 的修复根本没进包**
            - 构建用的是仓库里的 `sparkshell-src.tar.gz`，不是工作区；这个包一直是 1.6.0 的文件
            - 所以「取错 rootfs 路径」的 bug 一直存在，中间几个版本只是换了版本号
            - 本次已重新打包源码（含 rootfsPath 修复、路径自动纠正、版本号 v1.6.5）
            - versionName=1.6.5、versionCode=11

            **1.6.4**
            - 之前所有包的 versionCode 都是 1、versionName 全是 1.0.0，系统安装器可能直接跳过覆盖安装（这很可能就是你装了还是旧界面的原因）
            - 现在 versionName=1.6.4、versionCode=10，往后每版都递增

            **1.6.3**
            - 标题栏显示版本号（v1.6.3），装没装上一眼可辨
            - 文件页路径自动纠正：向上找同级 `rootfs/`，就算传进来的是 start.sh 也能自己认回去
            - 诊断框显示真正在用的 rootPath

            **1.6.2 修复根因：文件页拿到的是 proot 启动脚本路径，不是 rootfs**
            - 之前文件页的 rootPath = `files/proot/start.sh`（ensureReady 的返回值是脚本路径），所以永远「目录不存在」、上传也落不下去
            - 现在明确取 `LinuxEnv.rootfsPath`，并且构造时先校验是不是真实目录
            - 路径不合格时直接说「rootfs 路径不可用」，不再显示 `/` 这种误导性报错

            **1.6.1**
            - 首次解包还没跑到 /root 时自动等待重试（最多 8 次 × 4 秒），不再直接报错
            - 报错页显示真实 rootPath 与 rootfs 前 12 项，一眼定位
            - 新增「建出来再读」按钮
            - 兜底：/root 真不存在时自动切到根目录

            两个包，装哪个都行：
            - `app-alpine.apk`（约 60 MB）：Alpine rootfs，验证链路用，缺什么用 `apk add` 现装
            - `app-debian.apk`（约 177 MB）：Debian bookworm + apt/python3/git，开箱即用

            包名 com.grokggg.sparkshell，arm64-v8a，自签证书。

            1.6.0
            - 新增「文件」页：浏览容器任意目录、面屑跳转、长按重命名/删除/复制路径、新建文件夹
            - 点文本文件直接编辑并保存（300KB 上限，超限提示）；二进制文件给明确提示，不白屏
            - 右上角上传：系统文件选择器多选，直接复制进当前容器目录（/root/import 或指定目录）
            - 长按可导出到系统分享

            1.5.0
            - 会话持久化：Chat 左侧抽屉多会话，新建/切换/删除，每条消息落盘，退出不丢
            - 工具扩到 7 个：+ edit_file（唯一性校验 / replace_all）、search_files（正则，跳过二进制与大文件）、todo（清单 + 进度）
            - 容器 DNS 每次启动重写；/sdcard、/storage 挂进容器

            1.4.1
            - 修复工具命令没带 PATH（guest 里继承宿主 /system/bin，导致 ls/apk/python3 全 not found）
            - Agent 注入容器事实 preamble（Alpine 用 apk add，Debian 用 apt）
