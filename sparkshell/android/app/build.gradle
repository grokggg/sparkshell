plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.xinghuo.sparkshell"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.2.12479018"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile = file("../keystore/sparkshell.jks")
            storePassword = "sparkshell"
            keyAlias = "sparkshell"
            keyPassword = "sparkshell"
        }
    }

    defaultConfig {
        // 必须与 assets/proot 里 patch 进去的 loader 绝对路径一致：
    // /data/data/com.grokggg.sparkshell/files/proot/loader
    applicationId = "com.grokggg.sparkshell"
        minSdk = flutter.minSdkVersion
        targetSdk = 28  // W^X：targetSdk>=29 时禁止在私有目录 exec（proot 需要）
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // Flutter 只出 arm64 引擎（libflutter.so / libapp.so 仅 arm64-v8a），
    // 但 flutter_webrtc 这类插件自带三套 ABI 的 .so —— 结果 APK 里
    // lib/armeabi-v7a、lib/x86_64 有插件库却没有引擎：
    // 32 位设备"能装上、一启动就 UnsatisfiedLinkError 闪退"，还白占 23 MB。
    // 这里在打包阶段按目录剔掉，包才真的是 arm64 单架构。
    packaging {
        jniLibs {
            excludes += [
                "lib/armeabi-v7a/**",
                "lib/armeabi/**",
                "lib/x86/**",
                "lib/x86_64/**",
            ]
        }
    }

    lint {
        // targetSdk 28 是 W^X 的硬要求，Google Play 的过期告警当错误会中断构建
        abortOnError = false
        checkReleaseBuilds = false
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }
}

flutter {
    source = "../.."
}

// 没有额外依赖：XFS-1 以源码形式编进 APK（app/src/main/java/com/xinghuo/xfs1/Xfs1.java），
// 避免 jar 里的 java.util.Base64 在 API 26 以下崩，也免得 aar 与源码撞类。
